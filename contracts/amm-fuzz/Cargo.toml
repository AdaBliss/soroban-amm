[package]
name = "amm_fuzz"
version = "0.1.0"
edition = "2021"

# This is a test-only crate; it produces no WASM artifact.
[lib]
crate-type = ["lib"]

[dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1"
# Arbitrary-precision reference for the CL position-path conversions (#963).
num-bigint = "0.4"

[features]
# Deployed-contract CL properties: `concentrated_liquidity.wasm` must exist
# under target/wasm32v1-none/release (see the `fuzz-cl` Makefile target).
# Without this feature `cargo test -p amm-fuzz` runs only the fast pure-math
# and mirror properties, keeping the default runtime unchanged.
cl = []
