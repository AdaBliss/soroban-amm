version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule: { interval: weekly }
    groups:
      patch-updates: { update-types: [patch] }
      # rand and rand_pcg each implement the rand_core traits of their own
      # release line, so bumping one without the other does not compile
      # (#975, #977). Keep them in one PR.
      rand:
        patterns: ["rand", "rand_pcg"]
    ignore:
      # Major bumps have broken the build (events API redesign, deprecated
      # Env methods) - needs a deliberate migration, not an automatic PR.
      - dependency-name: "soroban-sdk"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/packages/sdk"
    schedule: { interval: weekly }
    groups: { patch-updates: { update-types: [patch] } }
    ignore:
      # TypeScript 7 requires an explicit tsconfig `rootDir`, which this
      # package doesn't set yet - bumping breaks `tsc`.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # v17 introduces ScValType changes that break src/governance.ts.
      - dependency-name: "@stellar/stellar-sdk"
        update-types: ["version-update:semver-major"]
      # A major @types/node bump should move with the Node major in .nvmrc,
      # not arrive on its own - types for a newer Node type-check APIs the
      # CI runtime does not have (#976).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/packages/ui-components"
    schedule: { interval: weekly }
    groups:
      patch-updates: { update-types: [patch] }
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # @vitest/coverage-v8 pins an exact vitest peer, so neither installs
      # without the other (#974, #978). Keep them in one PR.
      vitest:
        patterns: ["vitest", "@vitest/*"]
    ignore:
      # TypeScript 7's stricter cast checking breaks GovernanceForum.tsx.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Same @types/node rule as packages/sdk.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/packages/ts-advanced-client"
    schedule: { interval: weekly }
    groups: { patch-updates: { update-types: [patch] } }
    ignore:
      # Same TypeScript 7 rootDir issue as packages/sdk.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/services/graphql-api"
    schedule: { interval: weekly }
    groups:
      patch-updates: { update-types: [patch] }
      # graphql 17 has to land together with the two libraries that peer it.
      graphql:
        patterns: ["graphql", "@apollo/server", "graphql-subscriptions"]
    ignore:
      # graphql 17 cannot install yet (#965): @apollo/server 5.x peers
      # graphql ^16.11.0 and graphql-subscriptions 3.x peers ^15.7.2 || ^16.
      # Remove once both accept 17; #984 tracks the upgrade.
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      # Same @types/node rule as packages/sdk.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/services/webhook-streamer"
    schedule: { interval: weekly }
    groups: { patch-updates: { update-types: [patch] } }
    ignore:
      # Same @types/node rule as packages/sdk.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/services/health-dashboard"
    schedule: { interval: weekly }
    groups: { patch-updates: { update-types: [patch] } }
    ignore:
      # Same @types/node rule as packages/sdk.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # Shared ESLint toolchain used by every JS workspace (eslint.config.mjs).
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    groups:
      # typescript-eslint and @eslint/js track ESLint's own releases; bump
      # them together so the config never loads against a mismatched core.
      eslint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "globals"]
    ignore:
      # typescript-eslint supports TypeScript <6.1; move this only when its
      # peer range allows the new major. It is independent of the compiler
      # each workspace builds with.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/examples/client"
    schedule: { interval: weekly }
    groups: { patch-updates: { update-types: [patch] } }
    ignore:
      # Same @types/node rule as packages/sdk.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gomod
    directory: "/packages/go-sdk"
    schedule: { interval: weekly }
    groups: { patch-updates: { update-types: [patch] } }
  - package-ecosystem: pip
    directory: "/examples/python"
    schedule: { interval: weekly }
    groups: { patch-updates: { update-types: [patch] } }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups: { patch-updates: { update-types: [patch] } }
